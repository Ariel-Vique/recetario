<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/img/logo.png" type="image/jpeg" />
  <title>Recetario de la clase</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <div class="marca">
      <img src="img/logo.png" alt="Logo del recetario de la clase">
      <h1>Recetario de la clase</h1>
    </div>
    <button type="button" id="btn-tema">Modo oscuro</button>
  </header>

  <main>
    <section id="seccion-listado">
      <div class="barra-listado">
        <div>
          <h2>Recetas</h2>
          <p id="contador">0 recetas</p>
        </div>

        <div class="grupo-filtro">
          <label for="filtro-categoria">Categoría</label>
          <select id="filtro-categoria">
            <option value="Todas">Todas</option>
            <option value="Entrada">Entrada</option>
            <option value="Plato principal">Plato principal</option>
            <option value="Postre">Postre</option>
            <option value="Bebida">Bebida</option>
          </select>
        </div>
      </div>

      <ul id="lista-recetas"></ul>
    </section>

    <section id="seccion-formulario">
      <h2 id="titulo-form">Agregar receta</h2>
      <form id="form-receta">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required maxlength="80">
        </div>

        <div class="fila-doble">
          <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
              <option value="Entrada">Entrada</option>
              <option value="Plato principal">Plato principal</option>
              <option value="Postre">Postre</option>
              <option value="Bebida">Bebida</option>
            </select>
          </div>

          <div class="campo">
            <label for="tiempo">Tiempo (min)</label>
            <input type="number" id="tiempo" name="tiempo" required min="1" max="600">
          </div>
        </div>

        <div class="campo">
          <label for="imagen">Imagen (URL)</label>
          <input type="url" id="imagen" name="imagen">
        </div>

        <div class="campo">
          <label for="preparacion">Preparación con los ingredientes</label>
          <textarea id="preparacion" name="preparacion" maxlength="500"></textarea>
        </div>

        <div class="acciones-form">
          <button type="button" id="btn-cancelar" hidden>Cancelar</button>
          <button type="submit" id="btn-guardar">Guardar</button>
        </div>

        <p id="mensaje"></p>
      </form>
    </section>
  </main>

  <footer>
    <p></p>Recetario de la clase · Ariel Vique
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
